<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Holy Irún</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://holyburgerirun.com/">
  <link rel="icon" type="image/jpeg" href="img/LOGO.jpg">
  <link rel="apple-touch-icon" href="img/LOGO.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --brand-yellow: #ffc700;
      --text-main: #f4f4f6;
      --text-muted: #9c9ca8;
      --border-subtle: #27272f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image: radial-gradient(circle at center, rgba(255,199,0,0.07) 0%, rgba(9,9,11,1) 70%);
    }
    .code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 22vw, 12rem);
      line-height: 0.9;
      color: var(--brand-yellow);
      letter-spacing: 0.03em;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 0.04em;
      margin: 0.5rem 0 1rem;
      text-transform: uppercase;
    }
    p { color: var(--text-muted); max-width: 460px; margin-bottom: 2rem; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      text-decoration: none;
      border: 2px solid transparent;
      transition: all 0.25s ease;
    }
    .primary { background: var(--brand-yellow); color: #000; font-weight: 900; }
    .primary:hover { background: #ffd633; transform: translateY(-2px); }
    .outline { border-color: var(--border-subtle); color: var(--text-main); }
    .outline:hover { border-color: var(--brand-yellow); color: var(--brand-yellow); }
    :focus-visible { outline: 3px solid var(--brand-yellow); outline-offset: 3px; border-radius: 4px; }
    .damero {
      position: fixed; bottom: 0; left: 0; right: 0; height: 12px;
      background-color: var(--brand-yellow);
      background-image:
        linear-gradient(45deg, #000 25%, transparent 25%),
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%),
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Esta página se la han comido</h1>
  <p>No encontramos lo que buscabas, pero la carta sigue en su sitio y la Holy Sh*t también.</p>
  <div class="actions">
    <a href="index.html" class="btn primary">VOLVER AL INICIO</a>
    <a href="index.html#menu" class="btn outline">VER LA CARTA</a>
  </div>
  <div class="damero"></div>
</body>
</html>
